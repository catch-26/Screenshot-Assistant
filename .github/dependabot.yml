version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Europe/Berlin
    groups:
      gradle:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "02:00"
      timezone: Europe/Berlin
    groups:
      actions:
        patterns:
          - "*"
