name: README screenshots

on:
  push:
    branches: [claude/screenshots-tmp]
    paths-ignore: ['screenshots-out/**']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build
        run: ./gradlew build assembleDebugAndroidTest --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            ./.github/scripts/capture.sh
      - name: Report errors as annotation
        if: always()
        run: |
          { tail -30 build.log 2>/dev/null; grep -E "FAILURES|Error|Exception|at de\.|OK \(" instrument.log 2>/dev/null | head -40; ls out 2>/dev/null || true; } > summary.txt
          msg=$(sed -e 's/%/%25/g' summary.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Screenshot run::$msg"
      - name: Commit screenshots
        if: always()
        run: |
          mkdir -p screenshots-out
          cp out/*.png screenshots-out/ || true
          cp instrument.log screenshots-out/ || true
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add screenshots-out
          git commit -m "Captured screenshots" && git push origin HEAD:claude/screenshots-tmp
