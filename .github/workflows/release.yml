name: Release

# Publishes a release when the version in app/build.gradle has no tag yet:
# on a push to master that bumps the version, on a pushed tag, or by hand.
# Pushes that leave the version alone publish nothing.
# The tag and release title are the versionName, vYY.MM.N (N counts releases
# within the month from 0), versionCode is YYMMNN. Older releases were
# tagged 20261026..20261027d or with the versionCode; those count as released.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '!v*-pre'
      - '20*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: version
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME"
              exit 1
            fi
            RELEASE=true
          elif git rev-parse -q --verify "refs/tags/$VERSION_NAME-pre" >/dev/null; then
            echo "::error::$VERSION_NAME-pre is a pre-release with versionCode $VERSION_CODE; bump to the next running number"
            exit 1
          elif git rev-parse -q --verify "refs/tags/$VERSION_NAME" >/dev/null || git rev-parse -q --verify "refs/tags/$VERSION_CODE" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Version $VERSION_NAME ($VERSION_CODE) is already tagged; bump the version first"
              exit 1
            fi
            echo "Version $VERSION_NAME ($VERSION_CODE) is already released; nothing to do"
            RELEASE=false
          else
            RELEASE=true
            if [ ! -f "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" ]; then
              echo "::warning::fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt is missing, F-Droid will show no changelog for $VERSION_NAME"
            fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      VERSION_CODE: ${{ needs.check.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report build errors as annotation
        if: failure()
        run: |
          {
            grep -nE "What went wrong|^e: |error:|FAILURE|Could not|> " build.log | head -60
            echo "----- tail -----"
            tail -60 build.log
          } > summary.txt
          msg=$(sed -e 's/%/%25/g' summary.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Release build failed::$msg"

      - name: Collect release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ScreenshotAssistant-$VERSION.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v code="$VERSION_CODE" -v name="$VERSION" '/^# /{p=($2==code||$2==name)} p&&!/^# /' CHANGELOG.md > notes.md
          LAST_RELEASE=$(git tag -l 'v*' '20*' --sort=-creatordate | grep -v -- '-pre$' | grep -vx "$VERSION" | head -1)
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --generate-notes ${LAST_RELEASE:+--notes-start-tag "$LAST_RELEASE"}

  reproducible:
    needs: [check, release]
    uses: ./.github/workflows/reproducible.yml
    with:
      tag: ${{ needs.check.outputs.version }}
