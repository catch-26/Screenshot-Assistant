name: Release

on:
  push:
    tags:
      - '20*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check tag matches versionName
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME"
              exit 1
            fi
          elif git rev-parse -q --verify "refs/tags/$VERSION_NAME" >/dev/null; then
            echo "Tag $VERSION_NAME already exists; bump versionName first"
            exit 1
          fi
          echo "VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ScreenshotAssistant-$VERSION.apk"
          git archive --format=tar.gz --prefix="ScreenshotAssistant-$VERSION/" -o "dist/ScreenshotAssistant-$VERSION-source.tar.gz" "$GITHUB_SHA"
          cd dist && sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="$VERSION" '/^# /{p=($2==tag)} p&&!/^# /' CHANGELOG.md > notes.md
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --generate-notes
