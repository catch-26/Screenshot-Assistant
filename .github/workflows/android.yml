name: Android CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: ./gradlew build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report build errors as annotation
        if: failure()
        run: |
          {
            grep -nE -A12 "What went wrong" build.log | head -40
            grep -nE "^e: |error:|FAILED|Could not|Lint found" build.log | head -30
            echo "----- lint errors -----"
            grep -h -A3 ": Error:" app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt 2>/dev/null | head -60
            echo "----- lint error details -----"
            python3 .github/lint_errors.py app/build/reports/lint-results-debug.sarif 2>&1 | head -80
            echo "----- tail -----"
            tail -15 build.log
          } > summary.txt
          msg=$(sed -e 's/%/%25/g' summary.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::$msg"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
